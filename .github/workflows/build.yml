name: build

on:
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build image (no push)
        run: docker build -t helloworld-go:ci app
