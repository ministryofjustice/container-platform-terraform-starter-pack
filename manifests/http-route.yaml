apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: starter-pack-route
  namespace: ${namespace}
spec:
  parentRefs:
    - name: starter-pack-listenerset
      namespace: ${namespace}
      kind: ListenerSet
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: hello-world-service
          port: 8080
          weight: 1
